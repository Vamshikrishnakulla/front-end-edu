<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free study tutorials avaliable online">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="creators: Vamshi K">
    <title>Learning Hub</title>
    <link rel="icon" href="images/favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather&family=Montserrat&family=Sacramento&family=Ubuntu:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "montserrat-bold", Arial;
            margin: 0;
            /* https://source.unsplash.com/1550x800/?notes */
            background-image: url('images/contactimage1.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: white;
        }

        .container {
            padding: 40px 20% 0 20%;
        }

        .form-lable,
        .form-control {
            display: block;

        }

        .form-control:focus {
            border: 3px solid green;
            box-shadow: 2px 5px 8px 5px rgb(216, 210, 196);
        }

        .form-control {
            width: 100%;
            margin: 20px 0;
            padding: 15px;
            border: 3px solid black;
            border-radius: 10px;
        }

        footer {

            text-align: center;
            padding: 18px;
            background-color: #333;
            overflow: auto;
        }

        .container button {
            /*float: right;*/
            margin: 10px 0;
            padding: 7px 15px;
            border: 2px solid grey;
            background-color: aqua;
            border-radius: 10px;
        }

        @media screen and (max-width: 700px) {
            .container {

                padding: 20px 20px 0 20px;
                margin-bottom: 50px;
            }

            .container button {
                padding: 5px 10px;
            }

            footer {
                position: static;

            }
        }
    </style>
</head>

<body>

    <div id="header-placeholder"></div>

    <form>
        <div class="container">
            <h1 style="text-align: center;">Please, enter your details here.</h1>
            <h1 class="text-center">SignUp Form : </h1>
            <input style="display:none;" type="text" class="form-control" name="date" id="datatime" />
            <div class="mb-3">
                <label for="contactname" class="form-label">Name :</label>
                <input type="text" class="form-control" name="name" id="contactname" maxlength="40"
                    required>
            </div>
            <div class="mb-3">
                <label for="add" class="form-label">Admission No :</label>
                <input type="text" class="form-control" name="addno" id="add" maxlength="20"
                    required>
            </div>
            <div class="mb-3">
                <label for="college" class="form-label">College Name :</label>
                <input type="text" class="form-control" name="college" id="college" maxlength="40"
                    required>
            </div>
            <div class="mb-3">
                <label for="uni" class="form-label">University :</label>
                <input type="text" class="form-control" name="university" id="uni" maxlength="40"
                    required>
            </div>
            <div class="mb-3">
                <label for="branch" class="form-label">Branch :</label>
                <input type="text" class="form-control" name="branch" id="branch" maxlength="20"
                    required>
            </div>
            <div class="mb-3">
                <label for="contact_email" class="form-label">Email address :</label>
                <input type="email" class="form-control" name="email" id="contact_email" maxlength="40"
                    placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label for="text_area" class="form-label">password : </label>
                <input type="password" class="form-control" name="password" maxlength="20" id="text_area"
                    required>
            </div>
            <button type="submit" id="sub" class="btn">Submit</button>
        </div>
    </form>
    <br>
    <div id="footer-placeholder"></div>



    <script src="scripts/signup.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/components.js"></script>
</body>

</html>
