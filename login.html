<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free study tutorials avaliable online">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="creators: Vamshi K">
    <title>Learning Hub</title>
    <link rel="icon" href="images/favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather&family=Montserrat&family=Sacramento&family=Ubuntu:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "montserrat-bold", Arial;
            margin: 0;
            /* https://source.unsplash.com/1550x800/?notes */
            background-image: url('images/contactimage1.jpg');
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: white;
        }

        .container {
            padding: 40px 100px 0 100px;
        }

        .form-lable,
        .form-control {
            display: block;

        }

        .form-control:focus {
            border: 3px solid green;
            box-shadow: 2px 5px 8px 5px rgb(216, 210, 196);
        }

        .form-control {
            width: 100%;
            margin: 20px 0;
            padding: 15px;
            border: 3px solid black;
            border-radius: 10px;
        }

        footer {

            text-align: center;
            padding: 18px;
            background-color: #333;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            overflow: auto;
        }

        .container button {
            /*float: right;*/
            margin: 10px 0;
            padding: 7px 15px;
            border: 2px solid grey;
            background-color: aqua;
            border-radius: 10px;
        }

        @media screen and (max-width: 700px) {
            .container {

                padding: 20px 20px 0 20px;
                margin-bottom: 50px;
            }

            .container button {
                padding: 5px 10px;
            }

            footer {
                position: static;

            }
        }
    </style>
</head>

<body>

    <div id="header-placeholder"></div>


    <div class="container">
        <h1 style="text-align: center;">Please, enter your details here.</h1>
        <h1>Login details : </h1>
        <div>
            <label for="contact_email" class="form-label">Email address : </label>
            <input type="email" class="form-control" name="Email" id="contact_email" required>
        </div>
        <div>
            <label for="password" class="form-label">Password : </label>
            <input type="password" class="form-control" name="pass" id="password" required>
        </div>
        <button class="btn">Submit</button>
    </div>

    <br>
    <div id="footer-placeholder"></div>


    <script src="scripts/login.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/components.js"></script>
</body>

</html>
